<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <meta name="description" content="Pokédex Battle — explore os 151 pokémons originais e dispute batalhas contra a CPU. Por HC Projetos.">
  <title>Pokédex Battle · HC Projetos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://pokeapi.co">
  <link rel="preconnect" href="https://raw.githubusercontent.com">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <nav class="nav">
        <a href="#/" class="nav-brand">HC Projetos</a>
        <div class="nav-links">
          <a href="#/" class="nav-link" data-route="/">Home</a>
          <a href="#/pokedex" class="nav-link" data-route="/pokedex">Pokédex</a>
          <a href="#/select" class="nav-link" data-route="/select">Arena</a>
        </div>
      </nav>
    </header>

    <main>
      <!-- HOME -->
      <section id="screen-home" class="screen"></section>

      <!-- POKÉDEX -->
      <section id="screen-pokedex" class="screen">
        <div class="gb-screen">
          <h1 class="gb-title">— POKÉDEX —</h1>
          <div id="pokedex-loading" style="display:none;">
            <p class="loading-text" id="loading-text">Carregando pokémons...</p>
            <div class="loading-bar"><div class="fill" id="loading-fill" style="width:0%"></div></div>
          </div>
          <div class="pokemon-grid" id="pokemon-grid"></div>
        </div>
      </section>

      <!-- SELECT -->
      <section id="screen-select" class="screen">
        <div class="gb-screen">
          <div class="select-wrap">
            <h2>ESCOLHA OS LUTADORES</h2>
            <div class="slots">
              <div class="slot" data-slot="player">
                <h3>SEU POKÉMON</h3>
                <div class="slot-preview"><span class="empty">— vazio —</span></div>
                <div class="name">&nbsp;</div>
                <div class="slot-actions">
                  <button class="slot-btn" data-action="pick">ESCOLHER</button>
                  <button class="slot-btn" data-action="random">🎲 ALEATÓRIO</button>
                </div>
              </div>
              <div class="slot" data-slot="opponent">
                <h3>ADVERSÁRIO</h3>
                <div class="slot-preview"><span class="empty">— vazio —</span></div>
                <div class="name">&nbsp;</div>
                <div class="slot-actions">
                  <button class="slot-btn" data-action="pick">ESCOLHER</button>
                  <button class="slot-btn" data-action="random">🎲 ALEATÓRIO</button>
                </div>
              </div>
            </div>
            <div class="difficulty-picker">
              <span class="diff-label">DIFICULDADE</span>
              <div class="diff-options">
                <button class="diff-btn" data-diff="easy">🌱 FÁCIL</button>
                <button class="diff-btn active" data-diff="normal">🔥 NORMAL</button>
                <button class="diff-btn" data-diff="hard">💀 DIFÍCIL</button>
              </div>
              <p class="diff-hint">Batalha justa.</p>
            </div>
            <button class="start-battle" id="start-battle-btn" disabled>⚔ INICIAR BATALHA</button>
          </div>
        </div>
      </section>

      <!-- BATTLE -->
      <section id="screen-battle" class="screen">
        <div class="arena" id="arena"></div>
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <h4>HC PROJETOS</h4>
          <p>Feito com 💚 pelo irmão mais velho.</p>
        </div>
        <div class="footer-contact">
          <a href="mailto:henriqueptbd@gmail.com">📧 henriqueptbd@gmail.com</a>
        </div>
        <div class="footer-credits">
          Dados: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a><br>
          © 2026 HC Projetos
        </div>
      </div>
    </footer>
  </div>

  <!-- Modal (Pokédex details + Picker) -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <span class="modal-close" id="modal-close" aria-label="Fechar">&times;</span>
      <div id="pokemon-details"></div>
    </div>
  </div>

  <!-- Victory overlay -->
  <div id="victory-overlay" class="victory-overlay">
    <h2 id="victory-title"></h2>
    <div class="victory-actions">
      <button class="cta cta-primary" id="rematch-btn">⚔ LUTAR DE NOVO</button>
      <button class="cta cta-secondary" id="back-pokedex-btn">📖 VOLTAR À POKÉDEX</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
